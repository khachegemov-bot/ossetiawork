# Сканеры сайта: nginx закрывает им соединение кодом 444
# (запросы к .env, .git, WordPress, резервным копиям). Каждое такое обращение —
# признак бота, настоящий пользователь на эти адреса не ходит.
[Definition]
failregex = ^<HOST> -[^"]*"(?:GET|POST|HEAD|PUT|DELETE|OPTIONS|PROPFIND) [^"]*" 444 
ignoreregex =
