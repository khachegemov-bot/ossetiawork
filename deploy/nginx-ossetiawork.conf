# Ossetia Work — ossetiawork.ru
#
# Защита на входе: шифрование, заголовки безопасности, отсев сканеров,
# ограничение частоты запросов. Само приложение слушает только 127.0.0.1:5000
# и снаружи доступно исключительно через этот файл.

# Не больше 20 запросов к API в секунду с одного адреса, с запасом на всплески.
# Щедро намеренно: мобильные операторы сажают сотни людей на один адрес.
limit_req_zone $binary_remote_addr zone=ow_api:10m rate=20r/s;

server {
    server_name ossetiawork.ru www.ossetiawork.ru;

    # ---------- Заголовки безопасности ----------

    # Браузер больше никогда не откроет сайт без шифрования
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Не угадывать тип файла: картинка не выполнится как скрипт
    add_header X-Content-Type-Options "nosniff" always;
    # Не отдавать полный адрес страницы чужим сайтам
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Камера, микрофон, геопозиция, платежи — приложению не нужны, запрещены
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Откуда странице можно брать скрипты, стили, картинки и шрифты.
    # Встраивать приложение в чужую страницу можно только самому Telegram (веб-версия).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self' https://web.telegram.org https://*.telegram.org; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # ---------- Сканеры ----------
    # Боты ищут .env, .git, WordPress, резервные копии. Таких файлов у нас нет,
    # а соединение закрывается молча (444) — сканер не получает даже ответа.

    location ~ /\.(?!well-known) {
        return 444;
    }

    location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|xmlrpc|phpmyadmin|pma|mysql|cgi-bin|vendor|backup) {
        return 444;
    }

    location ~* \.(php|asp|aspx|jsp|cgi|sql|bak|old|orig|swp|zip|tar|gz|rar|7z)$ {
        return 444;
    }

    # ---------- Приложение ----------

    location /api/ {
        limit_req zone=ow_api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5000;
        proxy_connect_timeout 30;
        proxy_send_timeout 60;
        proxy_read_timeout 60;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_connect_timeout 30;
        proxy_send_timeout 60;
        proxy_read_timeout 60;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ossetiawork.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ossetiawork.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.ossetiawork.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = ossetiawork.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name ossetiawork.ru www.ossetiawork.ru;
    return 404; # managed by Certbot
}
