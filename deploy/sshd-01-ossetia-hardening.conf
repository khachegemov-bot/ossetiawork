# Защита входа на сервер.
# Файл называется «01-», потому что sshd берёт первое встреченное значение,
# а 50-cloud-init.conf включает вход по паролю — этот файл должен идти раньше.

# Только по ключу: 38 тысяч попыток подбора пароля в неделю становятся бесполезны
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PermitRootLogin prohibit-password

# Меньше попыток и времени на вход с одного подключения
MaxAuthTries 3
LoginGraceTime 20

X11Forwarding no
